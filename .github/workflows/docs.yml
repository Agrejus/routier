name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/db-migration/**"
      - "core/**"
      - "datastore/**"
      - "react/**"
      - "plugins/browser-storage/**"
      - "plugins/dexie/**"
      - "plugins/memory/**"
      - "plugins/pouchdb/**"
      - "plugins/sqlite/**"
      - "plugins/pglite/**"
      - "plugins/postgres-core/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Routier packages
        run: npm run build
      - name: Install docs dependencies
        working-directory: docs
        run: npm install --no-audit --no-fund
      - name: Build Lab and documentation site
        working-directory: docs
        run: npm run docs:build:with-lab
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
