apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      containers:
        - name: s3
          image: versity/versitygw:v1.8.0
          args: ["--port", ":7070", "posix", "/data"]
          env:
            - name: ROOT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: e2e-credentials
                  key: s3-access-key
            - name: ROOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: e2e-credentials
                  key: s3-secret-key
          ports:
            - containerPort: 7070
          readinessProbe:
            tcpSocket:
              port: 7070
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector:
    app: s3
  ports:
    - port: 7070
      targetPort: 7070
